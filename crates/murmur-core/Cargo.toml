[package]
name = "murmur-core"
version = "2.0.0"
edition = "2021"
description = "Pure, platform-independent logic for Murmur: command parsing, text formatting, silence detection, hotkey rules and the recording state machine."
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"
