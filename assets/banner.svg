<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wavePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#EC4899" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Radial Glow behind title -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <circle cx="640" cy="180" r="320" fill="url(#centerGlow)"/>

  <!-- Siri Wave Harmonic Curves -->
  <g opacity="0.65">
    <path d="M 0 310 C 240 310, 360 210, 540 230 C 720 250, 840 370, 1060 290 C 1180 250, 1240 300, 1280 300"
          fill="none" stroke="url(#waveCyan)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 290 C 200 290, 320 370, 520 330 C 720 290, 860 190, 1040 230 C 1160 255, 1220 280, 1280 285"
          fill="none" stroke="url(#wavePurple)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 300 C 180 300, 380 260, 580 300 C 780 340, 920 260, 1100 280 C 1200 290, 1250 295, 1280 295"
          fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(140, 95)">
    <!-- Rounded Squircle Badge -->
    <rect x="0" y="0" width="84" height="84" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="2" y="2" width="80" height="80" rx="22" fill="url(#accentGlow)" fill-opacity="0.12"/>

    <!-- Waveform Icon -->
    <g transform="translate(22, 22)">
      <rect x="4" y="14" width="4" height="12" rx="2" fill="#38BDF8"/>
      <rect x="12" y="8" width="4" height="24" rx="2" fill="#38BDF8"/>
      <rect x="20" y="2" width="4" height="36" rx="2" fill="#818CF8"/>
      <rect x="28" y="10" width="4" height="20" rx="2" fill="#A855F7"/>
      <rect x="36" y="16" width="4" height="8" rx="2" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Title & Core Typography -->
  <g transform="translate(250, 135)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
          font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">
      MURMUR
    </text>
    <text x="215" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      v2.0 · WHISPERFLOW
    </text>

    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
          font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Continuous Voice Learning & Local Dictation IDE for Windows
    </text>
  </g>

  <!-- Spec & Telemetry Pills -->
  <g transform="translate(140, 245)">
    <!-- Pill 1: 100% Offline -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#22C55E"/>
      <text x="28" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#E2E8F0">100% On-Device</text>
    </g>

    <!-- Pill 2: Sub-150ms -->
    <g transform="translate(195, 0)">
      <rect width="170" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#38BDF8"/>
      <text x="28" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#E2E8F0">&lt; 150ms Latency</text>
    </g>

    <!-- Pill 3: WhisperFlow -->
    <g transform="translate(380, 0)">
      <rect width="210" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#A855F7"/>
      <text x="28" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#E2E8F0">Self-Learning Memory</text>
    </g>

    <!-- Pill 4: Rust + Tauri -->
    <g transform="translate(605, 0)">
      <rect width="160" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#F97316"/>
      <text x="28" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#E2E8F0">Rust · Tauri v2</text>
    </g>

    <!-- Pill 5: Beautiful UI -->
    <g transform="translate(780, 0)">
      <rect width="180" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#EC4899"/>
      <text x="28" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#E2E8F0">Beautiful UI Design</text>
    </g>
  </g>

  <!-- Bottom Accent Hairline -->
  <line x1="0" y1="439" x2="1280" y2="439" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
</svg>
