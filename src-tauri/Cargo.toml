[package]
name = "murmur"
version = "2.0.0"
edition = "2021"
description = "Offline dictation and voice commands for Windows and macOS"
publish = false

[lib]
name = "murmur_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embeds the built interface in the program. tauri build turns this on.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
murmur-core = { path = "../crates/murmur-core" }
murmur-engine = { path = "../crates/murmur-engine" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone capture.
cpal = "0.15"

# Typing, shortcuts, media keys and the clipboard.
enigo = { version = "0.6", default-features = false }
arboard = { version = "3", default-features = false }
# Watches single-key hotkeys such as Right Alt.
rdev = "0.5"

[target.'cfg(windows)'.dependencies]
# Reads the focused editor after Murmur pastes text so user edits can become local training data.
uiautomation = "0.25"

# Model download with a checksum.
ureq = "2"
sha2 = "0.10"
# Opens links in the default browser and mail app.
open = "5"
